# Pass --weights runs/yolo640/weights/best.pt to fine-tune, not the COCO initialization.
model: yolo11s-pose.pt
task: pose
epochs: 20
imgsz: 960
batch: 2
workers: 0
optimizer: AdamW
lr0: 0.001
lrf: 0.01
cos_lr: true
seed: 42
deterministic: true
amp: true
cache: false
patience: 15
save: true
plots: true
fliplr: 0.5
flipud: 0.0
degrees: 10
translate: 0.1
scale: 0.4
mosaic: 0.0
mixup: 0.0
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
pose: 16.0
box: 6.0
dfl: 1.5
kobj: 1.0
