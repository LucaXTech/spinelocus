# Reference settings; batch and worker counts require adaptation to local hardware.
model: yolo11s-pose.pt
task: pose
epochs: 100
imgsz: 640
batch: -1
workers: 8
optimizer: auto
lr0: 0.01
lrf: 0.01
cos_lr: false
seed: 0
deterministic: true
amp: true
cache: false
patience: 100
save: true
fliplr: 0.5
flipud: 0.0
degrees: 10
translate: 0.1
scale: 0.4
mosaic: 0.0
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
erasing: 0.2
pose: 12.0
box: 7.5
dfl: 1.5
kobj: 1.0
nbs: 64
weight_decay: 0.0005
momentum: 0.937
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
