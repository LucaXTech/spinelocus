# Reference compatibility settings; the coordinate decoder differs from newer configurations.
model_name: hrnet_w18
feature_index: 3
pretrained: true
crop_size: 160
heatmap_size: 64
coordinate_convention: legacy_scale
sigma: 1.5
temperature_ce: 0.5
temperature_decode: 0.35
lambda_l1: 0.01
epochs: 30
batch_size: 16
accumulate: 2
workers: 0
lr: 0.0003
weight_decay: 0.0001
seed: 42
deterministic: true
amp: true
patience: 15
translate_fraction: 0.20
scale_range: [0.9, 1.2]
validation_jitter: 0.10
horizontal_flip: 0.0
