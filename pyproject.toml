[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spinelocus"
version = "0.1.7"
authors = [{name = "Luca Serioli"}]
license = "AGPL-3.0-only"
description = "Reproducible YOLO-Pose and HRNet refinement for thoracic DRR landmarks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "Pillow>=10,<13", "PyYAML>=6,<7", "scipy>=1.11,<2"]

[project.optional-dependencies]
train = ["torch==2.8.0", "torchvision==0.23.0", "timm==1.0.19", "huggingface_hub==0.34.4", "ultralytics==8.3.199", "opencv-python==4.11.0.86", "matplotlib>=3.8,<4", "tqdm>=4.66,<5"]
dev = ["ruff>=0.12,<1"]

[project.scripts]
spinelocus = "spinelocus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
